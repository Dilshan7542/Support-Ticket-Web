<header class="mb-4">
  <h2 class="h3 mb-1">Create Ticket</h2>
  <p class="app-muted mb-0">Create a complaint ticket manually, or enable AI prediction for category, priority, and department suggestion.</p>
</header>

<form class="card border-0 shadow-sm" [formGroup]="form" (ngSubmit)="submit()">
  <div class="card-body vstack gap-3">
    @if (error) {
      <div class="alert alert-danger mb-0">{{ error }}</div>
    }

    @if (createdTicket) {
      <div class="alert alert-success mb-0">
        Ticket {{ createdTicket.ticketNo || createdTicket.id }} created.
      </div>
    }

    <div>
      <label class="form-label" for="title">Title</label>
      <input id="title" class="form-control" formControlName="title" placeholder="Ticket title" />
    </div>

    <div>
      <label class="form-label" for="message">Message</label>
      <textarea id="message" class="form-control" formControlName="message" placeholder="Describe the issue" rows="6"></textarea>
    </div>

    <div class="form-check form-switch">
      <input id="aiPredictionEnabled" class="form-check-input" type="checkbox" formControlName="aiPredictionEnabled" />
      <label class="form-check-label" for="aiPredictionEnabled">Enable AI prediction</label>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Creating...' : 'Create Ticket' }}
      </button>
      <a class="btn btn-outline-secondary" routerLink="/tickets">Back</a>
    </div>
  </div>
</form>
