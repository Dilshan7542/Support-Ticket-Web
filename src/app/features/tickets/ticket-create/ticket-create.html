<header class="mb-4">
  <h2 class="h3 mb-1">Create Ticket</h2>
  <p class="app-muted mb-0">Create a complaint ticket. Routing is predicted by the backend from the issue details.</p>
</header>

<form class="card border-0 shadow-sm" [formGroup]="form" (ngSubmit)="submit()">
  <div class="card-body vstack gap-3">
    @if (error) {
      <div class="alert alert-danger mb-0">{{ error }}</div>
    }

    @if (createdTicket) {
      <div class="alert alert-success mb-0">
        Ticket {{ createdTicket.ticketNo || createdTicket.id }} created.
      </div>
    }

    <div>
      <label class="form-label" for="subject">Subject</label>
      <input id="subject" class="form-control" formControlName="subject" placeholder="Ticket subject" />
    </div>

    <div>
      <label class="form-label" for="description">Description</label>
      <textarea id="description" class="form-control" formControlName="description" placeholder="Describe the issue" rows="6"></textarea>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Creating...' : 'Create Ticket' }}
      </button>
      <a class="btn btn-outline-secondary" routerLink="/tickets">Back</a>
    </div>
  </div>
</form>
